# Phase B — LB over the node centrals (round-robin, health-checked).
# Published on host LOOPBACK ONLY (127.0.0.1:18080): the LB fronts the
# CENTRAL management API (users/roles/env mutation), which must not be
# reachable from other interfaces. Remove the 127.0.0.1 prefix only with
# an explicit allowlist/TLS story (plans/m4-review-fixes-2026-09-14.md C1).
services:
  lb:
    image: docker.io/library/nginx:alpine@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
    volumes:
      - ./nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
