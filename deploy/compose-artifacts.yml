# Phase C/H3 — shared S3 artifact store (MinIO) for the TEST cluster:
# nodes become stateless — large-text memories upserted via one node are
# readable via any node. node.env must add:
#   S3_ENDPOINT=http://minio:9000
#   S3_ACCESS_KEY=mcp-artifacts
#   S3_SECRET_KEY=change-me-minio-secret
services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:19000:9000"
    environment:
      MINIO_ROOT_USER: mcp-artifacts
      MINIO_ROOT_PASSWORD: change-me-minio-secret
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  miniodata:
