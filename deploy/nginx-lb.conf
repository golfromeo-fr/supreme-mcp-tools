# M4 Phase B — round-robin LB over the two node centrals.
# /health proxied for LB health checks; all API traffic balances across
# the cluster. Stateful /mcp clients need sticky sessions (ip_hash) —
# stateless clients float freely (the recommended mode).
upstream mcp_cluster {
    server node1:8200;
    server node2:8200;
}

server {
    listen 80;

    location /health {
        proxy_pass http://mcp_cluster/health;
        add_header X-Upstream $upstream_addr always;
    }

    location / {
        proxy_pass http://mcp_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Upstream $upstream_addr always;
    }
}
