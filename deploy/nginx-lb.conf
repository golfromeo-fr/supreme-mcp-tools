# M4 Phase B — LB over the two node centrals.
# /health proxied for LB health checks; all API traffic balances across
# the cluster. ip_hash pins each client to one node, so stateful /mcp
# sessions (node-local, see root AGENTS.md) survive across requests;
# stateless clients are unaffected by the pinning.
upstream mcp_cluster {
    ip_hash;
    server node1:8200;
    server node2:8200;
}

server {
    listen 80;

    location /health {
        proxy_pass http://mcp_cluster/health;
        add_header X-Upstream $upstream_addr always;
    }

    location / {
        proxy_pass http://mcp_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE / streaming + long-lived requests: HTTP/1.1 upstream, no
        # buffering, generous timeouts (nginx's 60s default kills /sse
        # and long-poll /mcp requests mid-stream).
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Upstream $upstream_addr always;
    }
}
